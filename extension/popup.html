<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1612; color: #d0e0d0;
      width: 340px; padding: 16px;
    }
    h1 { font-size: 16px; color: #6db88a; margin-bottom: 14px; letter-spacing: 0.08em; }
    label { display: block; font-size: 11px; color: #556655; text-transform: uppercase; letter-spacing: 0.06em; margin: 10px 0 4px; }
    input, textarea, select {
      width: 100%; background: #141f18; border: 1px solid #2a3d2e; border-radius: 5px;
      color: #d0e0d0; font-size: 14px; padding: 8px 10px; outline: none; font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { border-color: #6db88a; }
    textarea { resize: vertical; }
    .row { display: flex; gap: 6px; }
    .row select { flex: 0 0 120px; }
    .row input  { flex: 1; }
    .translateBtn {
      margin-top: 4px; background: none; border: 1px solid #2a3d2e; border-radius: 12px;
      color: #6db88a; font-size: 11px; padding: 3px 10px; cursor: pointer; width: 100%;
    }
    .translateBtn:hover { background: #1e3028; }
    .translateBtn:disabled { opacity: 0.4; cursor: default; }
    .saveBtn {
      margin-top: 14px; width: 100%; background: #2a5c3a; border: none; border-radius: 7px;
      color: #c0e8c8; font-size: 14px; font-weight: 600; padding: 11px; cursor: pointer;
    }
    .saveBtn:hover:not(:disabled) { background: #336b44; }
    .saveBtn:disabled { opacity: 0.5; cursor: default; }
    .msg { margin-top: 10px; font-size: 12px; text-align: center; }
    .ok  { color: #6db88a; }
    .err { color: #cc6666; }
    .setup { font-size: 12px; color: #556655; line-height: 1.6; }
    .setup a { color: #6db88a; }
    .tokenInput { margin-top: 8px; }
    .tokenSave {
      margin-top: 8px; width: 100%; background: #1e3028; border: none; border-radius: 5px;
      color: #6db88a; font-size: 13px; padding: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Vocab</h1>
  <div id="content"></div>
  <script src="popup.js"></script>
</body>
</html>
